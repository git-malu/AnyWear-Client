name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    secrets: inherit

  test:
    name: Unit Tests
    needs: [build]
    uses: ./.github/workflows/test.yml
    secrets: inherit

  browser:
    name: Browser Integration Tests
    needs: [test]
    uses: ./.github/workflows/browser.yml
    secrets: inherit
