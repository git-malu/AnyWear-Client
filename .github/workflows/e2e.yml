name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anywear_dev
        ports:
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Client
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: client
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: false

      - name: Checkout Service
        uses: actions/checkout@v4
        with:
          repository: git-malu/AnyWear-Service
          submodules: recursive
          path: service
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Client Dependencies
        working-directory: ./client
        run: pnpm install

      - name: Install Service Dependencies
        working-directory: ./service
        run: pnpm install

      - name: Setup Database
        working-directory: ./service
        run: pnpm db:push --force
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anywear_dev

      - name: Verify Database Tables
        run: |
          psql postgresql://postgres:postgres@localhost:5432/anywear_dev -c "\dt" | tee /tmp/db-tables.txt
          psql postgresql://postgres:postgres@localhost:5432/anywear_dev -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('users', 'clothing_items');" | grep -q "2" || { echo "ERROR: Expected tables not found!"; exit 1; }

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/dev-github-actions-e2e-role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fetch Secrets from Parameter Store
        run: |
          STAGE="dev"
          POOL_ID=$(aws ssm get-parameter --name "/anywear/$STAGE/cognito_user_pool_id" --query "Parameter.Value" --output text)
          CLIENT_ID=$(aws ssm get-parameter --name "/anywear/$STAGE/cognito_client_id" --query "Parameter.Value" --output text)
          S3_BUCKET=$(aws ssm get-parameter --name "/anywear/$STAGE/s3_bucket_name" --query "Parameter.Value" --output text)
          AWS_REGION=$(aws ssm get-parameter --name "/anywear/$STAGE/aws_region" --query "Parameter.Value" --output text)
          
          echo "USER_POOL_ID=$POOL_ID" >> $GITHUB_ENV
          echo "VITE_COGNITO_USER_POOL_ID=$POOL_ID" >> $GITHUB_ENV
          echo "VITE_COGNITO_CLIENT_ID=$CLIENT_ID" >> $GITHUB_ENV
          echo "COGNITO_USER_POOL_ID=$POOL_ID" >> $GITHUB_ENV
          echo "COGNITO_CLIENT_ID=$CLIENT_ID" >> $GITHUB_ENV
          echo "S3_BUCKET_NAME=$S3_BUCKET" >> $GITHUB_ENV
          echo "AWS_REGION=$AWS_REGION" >> $GITHUB_ENV

      - name: Start Service
        working-directory: ./service
        run: pnpm dev > /tmp/service.log 2>&1 &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anywear_dev
          PORT: 3000
          STAGE: dev
          COGNITO_USER_POOL_ID: ${{ env.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ env.COGNITO_CLIENT_ID }}
          S3_BUCKET_NAME: ${{ env.S3_BUCKET_NAME }}
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Wait for Service
        run: npx wait-on http://localhost:3000/health

      - name: Install Playwright Browsers
        working-directory: ./client
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E Tests
        working-directory: ./client
        run: pnpm run test:e2e
        env:
          VITE_API_BASE_URL: http://localhost:3000

      - name: Print Service Logs
        if: failure()
        run: cat /tmp/service.log || true

      - name: Upload Service Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: /tmp/service.log
