name: Build

on:
  workflow_call:
    secrets:
      APP_PRIVATE_KEY:
        required: true

# Read-only source checkout. The App token minted below is the only credential
# this workflow holds beyond the workflow's own `GITHUB_TOKEN`.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The published OpenAPI specification is the only thing Client source CI
      # reads from a private repository, and generating the API client is the
      # only step that reads it. Actions are pinned by commit so the
      # credential-bearing step cannot change under this workflow.
      - name: Generate API specification token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # One repository, named explicitly. Without `repositories` the action
          # mints a token for every repository the App installation grants.
          repositories: AnyWear-Service-API
          # Reading that one repository is the whole requirement.
          permission-contents: read

      # The specification revision is the Client submodule gitlink pinned in
      # .gitmodules, so `pnpm run orval` reads exactly the published revision and
      # the check below still fails when the generated client is stale.
      - name: Checkout API specification
        uses: actions/checkout@v4
        with:
          repository: git-malu/AnyWear-Service-API
          ref: 950774c339814ecfe83341e1ae42a54a098c307b
          path: api
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Production Dependencies
        run: pnpm run audit:prod

      - name: Lint
        run: pnpm run lint

      - name: Type Check
        run: pnpm run typecheck

      - name: Generate API Client (Orval)
        run: pnpm run orval

      - name: Check codegen consistency
        run: |
          git diff --exit-code || {
            echo "::error::Generated code is out of date. Run 'pnpm run orval' locally and commit the changes."
            exit 1
          }

      - name: Build
        env:
          # Source CI discards this build output; the publication chain builds
          # with the reviewed interface instead. These placeholders keep the
          # build-identity contract exercised without recording interface values
          # that no deployment ever compiled.
          VITE_API_BASE_URL: https://api.invalid
          VITE_COGNITO_USER_POOL_ID: ap-east-1_CiPlaceholder
          VITE_COGNITO_CLIENT_ID: abcdefghijklmnopqrstuvwxyz
        run: pnpm run build

  # `cargo check` reads no submodule content, so this job needs no App token.
  rust-check:
    name: Rust Check
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Tauri
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
