name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    secrets: inherit

  test:
    name: Unit Tests
    needs: [build]
    uses: ./.github/workflows/test.yml
    secrets: inherit

  e2e:
    name: E2E Tests
    needs: [test]
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
