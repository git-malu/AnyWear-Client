name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    # Exactly the one secret the called workflow declares, and nothing else. On an
    # event without repository secrets - a fork pull request, or Dependabot - the
    # value is empty, the token step fails, and no broader credential is handed to
    # untrusted source to make CI pass.
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  test:
    name: Unit Tests
    needs: [build]
    uses: ./.github/workflows/test.yml

  browser:
    name: Browser Integration Tests
    needs: [test]
    uses: ./.github/workflows/browser.yml
