name: Browser Integration Tests

# The browser scenarios mock the Service, image and identity boundaries and read
# the committed generated client, so this workflow needs no App token and no
# submodule.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    name: Client Browser Integration
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Client
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Browser Integration Tests
        run: pnpm run test:browser
