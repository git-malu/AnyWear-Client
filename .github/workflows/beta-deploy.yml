name: Deploy Beta Web Client

on:
  workflow_dispatch:
    inputs:
      writer_window:
        description: Manager-assigned Client publish window ID
        required: true
        type: string

# This queue only serializes Client runs. Cross-repository writers must be frozen
# and handed off by the manager before this workflow is dispatched.
concurrency:
  group: beta-client-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy the reviewed Beta web client
    if: vars.ENABLE_BETA_DEPLOY == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: beta
    permissions:
      id-token: write
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      BETA_DEPLOY_ENABLED: ${{ vars.ENABLE_BETA_DEPLOY }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      CLIENT_PUBLISH_ROLE_ARN: ${{ vars.CLIENT_PUBLISH_ROLE_ARN }}
      CLIENT_PUBLISH_WINDOW_INPUT: ${{ inputs.writer_window }}
      CLIENT_PUBLISH_WINDOW_ID: ${{ vars.CLIENT_PUBLISH_WINDOW_ID }}
      CLIENT_PUBLISH_WINDOW_CLIENT_SHA: ${{ vars.CLIENT_PUBLISH_WINDOW_CLIENT_SHA }}
      CLIENT_PUBLISH_WINDOW_EXPIRES_AT: ${{ vars.CLIENT_PUBLISH_WINDOW_EXPIRES_AT }}
      CLIENT_PUBLISH_WINDOW_RECORD_URL: ${{ vars.CLIENT_PUBLISH_WINDOW_RECORD_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate manager-assigned Client publish window
        run: node .github/scripts/assert-client-publish-window.mjs preflight

      - run: pnpm install --frozen-lockfile

      - name: Configure Beta AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CLIENT_PUBLISH_ROLE_ARN }}
          role-session-name: client-publish-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify Beta Client principal
        shell: bash
        run: |
          aws sts get-caller-identity --output json | jq -e \
            --arg account "$AWS_ACCOUNT_ID" \
            --arg arn "arn:aws:sts::$AWS_ACCOUNT_ID:assumed-role/beta-client-publish-role/client-publish-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            '.Account == $account and .Arn == $arn'

      - name: Resolve Beta deployment settings
        id: settings
        shell: bash
        run: |
          platform_outputs="$(aws cloudformation describe-stacks \
            --stack-name AnyWearPlatformStack-beta --query 'Stacks[0].Outputs' --output json)"
          workload_outputs="$(aws cloudformation describe-stacks \
            --stack-name AnyWearWorkloadStack-beta --query 'Stacks[0].Outputs' --output json)"
          bucket="$(jq -er '.[] | select(.OutputKey=="ClientBucketName") | .OutputValue' <<<"$platform_outputs")"
          distribution="$(jq -er '.[] | select(.OutputKey=="ClientDistributionId") | .OutputValue' <<<"$platform_outputs")"
          api_url="$(jq -er '.[] | select(.OutputKey=="ApiBaseUrl") | .OutputValue' <<<"$workload_outputs")"
          pool_id="$(aws ssm get-parameter --name /anywear/beta/cognito_user_pool_id --query Parameter.Value --output text)"
          client_id="$(aws ssm get-parameter --name /anywear/beta/cognito_client_id --query Parameter.Value --output text)"
          {
            echo "bucket=$bucket"
            echo "distribution=$distribution"
            echo "api_url=$api_url"
            echo "pool_id=$pool_id"
            echo "client_id=$client_id"
          } >> "$GITHUB_OUTPUT"

      - name: Build Beta web client
        env:
          VITE_API_BASE_URL: ${{ steps.settings.outputs.api_url }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.settings.outputs.pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.settings.outputs.client_id }}
          VITE_COGNITO_IDENTITY_POOL_ID: ''
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: pnpm build

      - name: Publish static assets
        env:
          CLIENT_BUCKET: ${{ steps.settings.outputs.bucket }}
          CLIENT_DISTRIBUTION: ${{ steps.settings.outputs.distribution }}
        run: |
          node .github/scripts/assert-client-publish-window.mjs publish
          aws s3 sync dist "s3://$CLIENT_BUCKET" --delete
          invalidation="$(aws cloudfront create-invalidation \
            --distribution-id "$CLIENT_DISTRIBUTION" --paths '/*' \
            --query Invalidation.Id --output text)"
          {
            echo '### Client publish request'
            echo "- Client source: \`$GITHUB_SHA\`"
            echo "- Bucket: \`$CLIENT_BUCKET\`"
            echo "- Distribution: \`$CLIENT_DISTRIBUTION\`"
            echo "- Invalidation: \`$invalidation\`"
          } >> "$GITHUB_STEP_SUMMARY"
