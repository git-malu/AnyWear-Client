name: Build

on:
  workflow_call:
    secrets:
      APP_PRIVATE_KEY:
        required: true

# Read-only source checkout. The App token below is the only credential this
# workflow holds, and it is limited to the repositories this build checks out.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # AnyWear-Client is this checkout; AnyWear-Service-API is the private
          # `api` submodule. Naming them keeps the token off every other
          # repository the App installation grants.
          repositories: AnyWear-Client,AnyWear-Service-API
          # Reading the two repositories above is the whole requirement.
          permission-contents: read

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Production Dependencies
        run: pnpm run audit:prod

      - name: Lint
        run: pnpm run lint

      - name: Type Check
        run: pnpm run typecheck

      - name: Generate API Client (Orval)
        run: pnpm run orval

      - name: Check codegen consistency
        run: |
          git diff --exit-code || {
            echo "::error::Generated code is out of date. Run 'pnpm run orval' locally and commit the changes."
            exit 1
          }

      - name: Build
        run: pnpm run build

  rust-check:
    name: Rust Check
    runs-on: windows-latest

    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: AnyWear-Client,AnyWear-Service-API
          permission-contents: read

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Tauri
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
